name: Generate product and journal SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "Layout/data/posts.json"
      - "scripts/build-seo-pages.mjs"
      - ".github/workflows/generate-seo-pages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static product and article pages
        run: node scripts/build-seo-pages.mjs
      - name: Commit generated pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products journal sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "chore: refresh catalogue SEO pages and sitemap"
          git push
